<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة نوبي</title><style>body{margin:0;background:#090b10;color:#f8f4eb;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:35px auto;padding:0 18px}.panel{background:#141b27;border:1px solid #2a374a;border-radius:18px;padding:22px;margin:16px 0}h1,h2{color:#e0ad4f}input,textarea,select,button{font:inherit;border-radius:9px;padding:11px;margin:5px 0}input,textarea,select{width:100%;box-sizing:border-box;background:#0a0e15;color:#fff;border:1px solid #2a374a}button{border:1px solid #e0ad4f;background:#e0ad4f;color:#171208;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.muted{color:#9ca9bb}.hidden{display:none}.stat{font-size:30px;color:#e0ad4f;font-weight:bold}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}</style></head><body><main class="wrap"><h1>نوبي — لوحة الإدارة</h1><p class="muted">هذه الصفحة خاصة بالمشغل، ولا تظهر صلاحياتها للزوار.</p><section id="login" class="panel"><h2>دخول المشغل</h2><input id="email" placeholder="البريد الإداري"><input id="pass" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول آمن</button><p id="msg"></p></section><section id="dash" class="hidden"><div class="panel"><div class="row"><div><h2>الإحصائيات</h2><div class="stat" id="users">—</div><div class="muted">مستخدمون</div></div><div><div class="stat" id="manga">—</div><div class="muted">أعمال</div></div><div><div class="stat" id="views">—</div><div class="muted">مشاهدات الإعلانات</div></div><div><div class="stat" id="clicks">—</div><div class="muted">نقرات الإعلانات</div></div></div></div><div class="panel"><h2>إضافة عمل</h2><div class="grid"><input id="ta" placeholder="العنوان العربي"><input id="te" placeholder="العنوان الإنجليزي"><input id="cat" placeholder="التصنيف"><input id="cover" placeholder="رابط الغلاف أو مساره"><input id="rating" type="number" step="0.1" placeholder="التقييم"><textarea id="desc" placeholder="الوصف"></textarea></div><button onclick="addManga()">حفظ العمل</button></div><div class="panel"><h2>إضافة فصل</h2><input id="mid" type="number" placeholder="رقم العمل"><input id="num" type="number" placeholder="رقم الفصل"><input id="ct" placeholder="عنوان الفصل"><textarea id="pages" placeholder="روابط صفحات الفصل، رابط في كل سطر"></textarea><textarea id="translated" placeholder="النص العربي المعتمد، اختياري"></textarea><button onclick="addChapter()">حفظ الفصل</button></div><div class="panel"><h2>إعداد إعلان</h2><select id="slot"><option value="home-top">الرئيسية</option><option value="library-inline">بين الأعمال</option><option value="reader-bottom">أسفل القارئ</option></select><input id="adtitle" placeholder="عنوان الإعلان"><input id="adbody" placeholder="نص الإعلان"><input id="adhref" placeholder="رابط الإعلان"><select id="mode"><option value="house">إعلان داخلي</option><option value="adsense">AdSense</option></select><input id="client" placeholder="AdSense client ID (اختياري)"><input id="adslot" placeholder="AdSense slot ID (اختياري)"><button onclick="saveAd()">حفظ الإعلان</button></div></section></main><script>const $=x=>document.querySelector(x);async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(o.headers||{})},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر الطلب');return d}function msg(x){$('#msg').textContent=x}async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');load()}catch(e){msg(e.message)}}async function load(){try{const d=await api('/api/admin/summary');$('#users').textContent=d.users;$('#manga').textContent=d.manga;$('#views').textContent=d.adViews;$('#clicks').textContent=d.adClicks}catch(e){msg(e.message)}}async function addManga(){try{const d=await api('/api/admin/manga',{method:'POST',body:JSON.stringify({titleAr:$('#ta').value,titleEn:$('#te').value,category:$('#cat').value,coverUrl:$('#cover').value,rating:$('#rating').value,description:$('#desc').value})});$('#mid').value=d.id;msg('تم حفظ العمل برقم '+d.id)}catch(e){msg(e.message)}}async function addChapter(){try{await api('/api/admin/manga/'+$('#mid').value+'/chapters',{method:'POST',body:JSON.stringify({number:$('#num').value,title:$('#ct').value,pages:$('#pages').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean),translatedText:$('#translated').value})});msg('تم حفظ الفصل')}catch(e){msg(e.message)}}async function saveAd(){try{await api('/api/admin/ads/'+$('#slot').value,{method:'PUT',body:JSON.stringify({mode:$('#mode').value,title:$('#adtitle').value,body:$('#adbody').value,href:$('#adhref').value,clientId:$('#client').value,adSlot:$('#adslot').value})});msg('تم حفظ إعداد الإعلان')}catch(e){msg(e.message)}}</script></body></html>
